{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Buddy | Admin Login</title>
    <link rel="stylesheet" href="{% static 'delivery/css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="hero-container auth-container">
        <div class="signup-card" style="max-width:420px;">
            <div class="text-center mb-8">
                <div class="logo-icon mx-auto mb-4" style="width:52px;height:52px;">
                    <i class="fas fa-shield-halved text-black"></i>
                </div>
                <h2 class="text-3xl font-bold">Admin Portal</h2>
                <p class="text-gray-400 text-sm mt-2">Restricted access — staff only.</p>
            </div>

            {% if error %}
            <div class="text-red-400 text-sm mb-6 text-center bg-red-900/20 py-2 rounded-lg border border-red-900/50">
                {{ error }}
            </div>
            {% endif %}

            <form action="{% url 'admin_signin' %}" method="post">
                {% csrf_token %}
                <div class="form-group">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" class="auth-input" placeholder="Admin Username" required>
                </div>
                <div class="form-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" class="auth-input" placeholder="Password" required>
                </div>
                <button type="submit" class="cta-btn btn-full">
                    <i class="fas fa-sign-in-alt mr-2"></i>Sign In as Admin
                </button>
            </form>

            <div class="text-center mt-6">
                <a href="{% url 'index' %}" class="text-gray-500 text-sm hover:text-white transition-colors">
                    <i class="fas fa-arrow-left mr-1"></i>Back to Home
                </a>
            </div>
        </div>
    </div>
</body>
</html>
