{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Buddy | Authenticating...</title>
    <link rel="stylesheet" href="{% static 'delivery/css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #050505;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .transition-container {
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }
        .success-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: white;
            box-shadow: 0 0 60px rgba(16, 185, 129, 0.4);
            margin: 0 auto 32px;
            animation: scaleIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes scaleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .glow-text {
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 800;
            font-size: 2.5rem;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
        }
        .sub-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.1rem;
        }
        .loader-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 40px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
            z-index: -1;
            filter: blur(80px);
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="transition-container">
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>
        <h1 class="glow-text">Welcome, {{username}}!</h1>
        <p class="sub-text">Preparing your premium culinary experience...</p>
        
        <div class="loader-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <script>
        // Automatic redirect to dashboard after animation
        setTimeout(() => {
            window.location.href = "{% url 'dashboard' username %}";
        }, 2200);
    </script>
</body>
</html>
